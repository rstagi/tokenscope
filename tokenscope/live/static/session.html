<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tokenscope · session</title><link rel="stylesheet" href="/static/live.css"></head>
<body data-page="session">
<header>
  <a id="back" class="back" href="/">← board</a> <span id="conn" class="conn"></span>
  <div class="shead">
    <div>
      <div class="goal" id="h-goal">loading…</div>
      <div class="sub"><span id="h-proj"></span> &nbsp; <span id="h-pill"></span> &nbsp; ⏱ <b id="h-el">–</b> &nbsp; <span id="h-turns"></span></div>
      <div class="flaglist" id="h-flags"></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">CW so far</div><div class="v" id="h-cw">–</div></div>
      <div class="kpi"><div class="l">API-equiv $</div><div class="v" id="h-usd">–</div></div>
      <div class="kpi gauge"><div class="l">context <span id="h-ctx" class="mut"></span></div><div class="bar"><i id="h-gauge" style="width:0"></i></div></div>
    </div>
  </div>
  <div id="ribbon" class="ribbon" title="one segment per turn, width ∝ CW"></div>
  <div id="legend" class="legend"></div>
</header>
<main>
  <div id="notfound" class="empty" style="display:none"></div>
  <div id="body">
    <section class="card fmapc"><div class="fm-head"><b>Flow map</b><span class="sub">goal → phases → tools · arrow width ∝ CW · subagents branch below</span><span id="fm-meta" class="sub" style="margin-left:auto"></span></div>
      <svg id="fmap" class="fmap" xmlns="http://www.w3.org/2000/svg"></svg></section>
    <div class="tools"><span class="sub">Flow — consecutive turns of the same phase are collapsed; click to expand.</span>
      <label class="toggle"><input type="checkbox" id="follow" checked> follow</label></div>
    <div id="s-empty" class="empty" style="display:none">Nothing happened in this session yet.</div>
    <div id="timeline" class="timeline"></div>
  </div>
</main>
<button id="jump" class="jump">↓ new steps</button>
<script src="/static/live.js"></script>
</body></html>
